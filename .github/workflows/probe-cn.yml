# 国内视角入口：由 label 为 cn 的 self-hosted runner 执行（未注册 runner 时会排队等待，属正常现象）。
# 探活逻辑统一在 probe-core.yml（可复用工作流）。
name: Probe CN View

on:
  schedule:
    # 每 6 小时一次（UTC），与国际视角错开 15 分钟
    - cron: "45 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  call-probe:
    uses: ./.github/workflows/probe-core.yml
    with:
      view: cn
    secrets: inherit
