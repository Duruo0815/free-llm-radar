# 国际视角入口：每 6 小时定时探活 + 部署；push 时只用仓库现有数据部署（节省各家配额）。
# 探活逻辑统一在 probe-core.yml（可复用工作流），密钥等配置也集中在那里维护。
name: Probe & Deploy

on:
  schedule:
    # 每 6 小时自动检测一次（UTC 时间）
    - cron: "30 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  call-probe:
    uses: ./.github/workflows/probe-core.yml
    with:
      view: intl
      # push 触发时不探活（避免频繁提交消耗各家配额），只用已提交的数据重新部署
      run_probe: ${{ github.event_name != 'push' }}
    secrets: inherit
